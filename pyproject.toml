[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "car-tts"
version = "0.1.0"
description = "Reproducible F5-TTS fine-tuning, RTF/MOS evaluation, and activation-guided FFN pruning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Acking646"}]
dependencies = []

[project.optional-dependencies]
tts = ["f5-tts==1.1.16", "torch>=2.1", "soundfile>=0.12", "numpy>=1.26", "tqdm>=4.66"]
test = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
car-tts = "car_tts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
